<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sonny's Deep Dive</title>
<style>
  html,body{margin:0;height:100%;background:#061a2e;font-family:"Trebuchet MS",Verdana,sans-serif;overflow:hidden}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%}
  canvas{background:#000;box-shadow:0 0 40px #000;image-rendering:auto;max-width:100vw;max-height:100vh}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="600"></canvas></div>
<script>
'use strict';
const W = 960, H = 600;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

// ---------- Levels ----------
const LEVELS = [
  {name:'Sunny Cove',        sky:'#8fd3ff', sand:'#f2dda4', water:'#1c8bd8', deep:'#04213f', fish:['Clownfish','Blue Tang','Angelfish','Parrotfish','Butterflyfish']},
  {name:'Coral Bay',         sky:'#a5e0ff', sand:'#f7e2b0', water:'#1aa0c9', deep:'#032b45', fish:['Lionfish','Triggerfish','Wrasse','Damselfish','Goby']},
  {name:'Palm Shore',        sky:'#ffd39a', sand:'#f5e6b8', water:'#1985c4', deep:'#06213a', fish:['Sea Horse','Pufferfish','Grouper','Snapper','Mandarinfish']},
  {name:'Pebble Beach',      sky:'#b7d7f2', sand:'#d8cfb8', water:'#2a7fb5', deep:'#0a1f33', fish:['Cod','Halibut','Sculpin','Rockfish','Sardine']},
  {name:'Lagoon Point',      sky:'#c5f0ff', sand:'#fff1c4', water:'#12b0b8', deep:'#013b3f', fish:['Barracuda','Trumpetfish','Boxfish','Filefish','Unicornfish']},
  {name:'Sunset Strand',     sky:'#ff9d6c', sand:'#e8c99a', water:'#2b6fb2', deep:'#141a3c', fish:['Tuna','Mahi-Mahi','Flying Fish','Marlin','Wahoo']},
  {name:'Kelp Harbor',       sky:'#9fc9d8', sand:'#c9c1a3', water:'#1e7a6d', deep:'#022a26', fish:['Garibaldi','Kelp Bass','Sheephead','Senorita','Opaleye']},
  {name:'Iceberg Inlet',     sky:'#dcefff', sand:'#eef4f8', water:'#3e8fd0', deep:'#0b1d3a', fish:['Icefish','Arctic Char','Capelin','Greenland Halibut','Lumpfish']},
  {name:'Volcano Reef',      sky:'#6e5a6c', sand:'#3d3a3a', water:'#9a3b2b', deep:'#2a0a08', fish:['Firefish','Flame Angelfish','Lava Goby','Hawkfish','Fairy Basslet']},
  {name:'Lost Atoll',        sky:'#5fa8ff', sand:'#ffe9b0', water:'#0c5fd8', deep:'#000a25', fish:['Moonfish','Oarfish','Anglerfish','Lanternfish','Coelacanth']},
];
const FISH_COLORS = ['#ff7a30','#3a7bff','#ffd23a','#5be36c','#ff4fd8','#ff5555','#9d6bff','#00d8ff','#ffb347','#c7f464'];

// ---------- Input ----------
const keys = {};
let mouse = {x:W/2,y:H/2,down:false};
window.addEventListener('keydown', e => { keys[e.code]=true; if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); onKey(e.code); });
window.addEventListener('keyup', e => keys[e.code]=false);
function canvasPos(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height}; }
cv.addEventListener('mousemove', e => { const p=canvasPos(e); mouse.x=p.x; mouse.y=p.y; });
cv.addEventListener('mousedown', e => { mouse.down=true; onClick(); });
cv.addEventListener('mouseup', () => mouse.down=false);

// ---------- Helpers ----------
const rand = (a,b)=>a+Math.random()*(b-a);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const dist = (a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const SURFACE = 260;            // y of the water line (world coords)
let WORLD_W = 3200, WORLD_H = 1900;

// ---------- Game state ----------
let state = 'title';            // title | play | levelDone | win
let levelIdx = 0, L = LEVELS[0];
let sonny, cam, fish, chests, enemies, spears, bubbles, particles, boss, msgs;
let fishFound, chestsFound, deaths, totalDeaths=0, shotCd=0, hurtFlash=0, tick=0, bossWarn=0, levelDoneT=0;

function startLevel(i){
  levelIdx=i; L=LEVELS[i];
  WORLD_W = 3200 + i*200; WORLD_H = 1900 + i*80;
  sonny = {x:220,y:SURFACE-30,vx:0,vy:0,hp:100,maxHp:100,r:22,face:1,inv:0,onBeach:true};
  cam = {x:0,y:0};
  fish=[]; chests=[]; enemies=[]; spears=[]; bubbles=[]; particles=[]; msgs=[]; boss=null;
  fishFound=0; chestsFound=0; deaths=0; bossWarn=0; levelDoneT=0;
  // rocks/seafloor decor
  decor = [];
  for(let k=0;k<40;k++) decor.push({x:rand(300,WORLD_W-100),y:rand(SURFACE+300,WORLD_H-40),r:rand(20,80),kind:Math.random()<0.5?'rock':'coral',c:FISH_COLORS[k%10]});
  // 5 fish
  for(let k=0;k<5;k++){
    fish.push({x:rand(700,WORLD_W-200),y:rand(SURFACE+150,WORLD_H-150),vx:rand(-1,1)||0.7,vy:0,name:L.fish[k],c:FISH_COLORS[(k+i*3)%10],r:16,ph:rand(0,6),got:false,shy:0});
  }
  // 5 chests near floor
  for(let k=0;k<5;k++){
    chests.push({x:600+k*((WORLD_W-900)/5)+rand(0,200),y:WORLD_H-rand(50,300),open:false,r:22});
  }
  // enemies
  const nSharks = 3+Math.floor(i*0.8), nEels = 3+Math.floor(i*0.7);
  for(let k=0;k<nSharks;k++) enemies.push(makeShark(rand(900,WORLD_W-200),rand(SURFACE+200,WORLD_H-200)));
  for(let k=0;k<nEels;k++){ const d=decor[Math.floor(rand(0,decor.length))]; enemies.push(makeEel(d.x,d.y-10)); }
  say(`Level ${i+1}: ${L.name}`, 180);
  say('Find 5 fish and 5 treasure chests!', 240);
}
let decor=[];
function makeShark(x,y){ return {kind:'shark',x,y,vx:rand(-2,2),vy:0,hp:3,r:34,face:1,speed:2.1+levelIdx*0.15,cool:0,boss:false}; }
function makeEel(x,y){ return {kind:'eel',x,y,hx:x,hy:y,vx:0,vy:0,hp:2,r:20,face:1,speed:4+levelIdx*0.2,cool:0,lunge:0,boss:false}; }
function makeBoss(){ return {kind:'shark',x:clamp(sonny.x+700,400,WORLD_W-300),y:clamp(sonny.y,SURFACE+200,WORLD_H-200),vx:0,vy:0,hp:20,maxHp:20,r:80,face:-1,speed:2.6+levelIdx*0.15,cool:0,boss:true,dash:0}; }
function say(t,d){ msgs.push({t,d}); }

// ---------- Audio (procedural, Web Audio API) ----------
const Audio_ = (()=>{
  let ac=null, master=null, musicGain=null, muted=false, track=null, nextBeat=0, step=0, timer=null;
  const SCALES = {major:[0,2,4,5,7,9,11], minor:[0,2,3,5,7,8,10]};
  function init(){
    if(ac) return; ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain(); master.gain.value=muted?0:0.8; master.connect(ac.destination);
    musicGain=ac.createGain(); musicGain.gain.value=0.5; musicGain.connect(master);
    timer=setInterval(schedule,50);
  }
  function tone({f,t,d,type='sine',v=0.2,dest=musicGain,slide=0,att=0.01}){
    const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+att); g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t+d+0.05);
  }
  function noise(t,d,v,dest){
    const buf=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate), data=buf.getChannelData(0);
    for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*(1-i/data.length);
    const s=ac.createBufferSource(); s.buffer=buf; const g=ac.createGain(); g.gain.value=v;
    const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1200;
    s.connect(f); f.connect(g); g.connect(dest||master); s.start(t);
  }
  const note=(root,scale,deg,oct=0)=>root*Math.pow(2,(scale[((deg%7)+7)%7]+Math.floor(deg/7)*12+oct*12)/12);
  // Tracks: {bpm, root, scale, chords(degrees), melody(pattern)}
  const TRACKS = {
    title:{bpm:96, root:130.81, scale:'major', chords:[0,3,4,5], bass:'reggae'},
    beach:{bpm:104,root:146.83, scale:'major', chords:[0,5,3,4], bass:'reggae'},
    dive: {bpm:92, root:110,    scale:'major', chords:[0,3,5,4], bass:'pulse'},
    boss: {bpm:150,root:82.41,  scale:'minor', chords:[0,0,5,4], bass:'drive'},
    win:  {bpm:120,root:174.61, scale:'major', chords:[0,4,5,3], bass:'reggae'},
  };
  function play(name){ if(track===name) return; track=name; step=0; if(ac) nextBeat=ac.currentTime+0.05; }
  function schedule(){
    if(!ac||!track) return;
    const T=TRACKS[track], sc=SCALES[T.scale], beat=60/T.bpm/2; // 8th notes
    while(nextBeat<ac.currentTime+0.25){
      const t=nextBeat, bar=Math.floor(step/8)%4, s=step%8, chord=T.chords[bar];
      const root=T.root;
      const boss = track==='boss';
      // drums
      if(s===0||s===4) noise(t,0.12,boss?0.5:0.25); // kick-ish thump
      if(boss?(s%2===0):(s===2||s===6)) { const o=ac.createOscillator(),g=ac.createGain(); o.frequency.setValueAtTime(boss?160:120,t); o.frequency.exponentialRampToValueAtTime(40,t+0.12); g.gain.setValueAtTime(0.6,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15); o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+0.2); }
      if(s%2===1) noise(t,0.05,boss?0.18:0.1); // hats
      // bass
      if(T.bass==='reggae'){ if(s===0||s===3||s===5) tone({f:note(root,sc,chord,-1),t,d:beat*1.6,type:'triangle',v:0.35}); }
      else if(T.bass==='pulse'){ if(s%2===0) tone({f:note(root,sc,chord + (s===6?4:0),-1),t,d:beat*1.2,type:'sine',v:0.35}); }
      else { tone({f:note(root,sc,chord+(s%4===3?-1:0),-1),t,d:beat*0.9,type:'sawtooth',v:0.22}); }
      // chords (soft pad every bar / stabs)
      if(s===0){ [0,2,4].forEach(k=>tone({f:note(root,sc,chord+k,1),t,d:beat*8,type:boss?'square':'triangle',v:boss?0.05:0.07,att:0.4})); }
      if(!boss && (s===2||s===6)) [0,2,4].forEach(k=>tone({f:note(root,sc,chord+k,1),t,d:beat*0.7,type:'square',v:0.04}));
      // melody: deterministic pseudo-random arpeggio per level so each beach sounds a bit different
      const seed=(step*7+levelIdx*13+bar*3)%11;
      const degs=boss?[0,2,3,5,7,3,2,0]:[0,2,4,7,4,2,9,7];
      if(boss? (s%2===0||seed>7) : (s%2===0||seed>6)){
        const d=chord+degs[(s+seed)%8]+(seed>8?7:0);
        tone({f:note(root,sc,d,2),t,d:beat*(boss?0.9:1.4),type:boss?'sawtooth':'sine',v:boss?0.09:0.16});
        if(!boss && s===0 && bar%2===1) tone({f:note(root,sc,d+2,2),t:t+beat*0.5,d:beat*1.5,type:'sine',v:0.1});
      }
      nextBeat+=beat; step++;
    }
  }
  // SFX
  const sfx = {
    shoot(){ if(!ac) return; const t=ac.currentTime; tone({f:900,t,d:0.15,type:'square',v:0.15,dest:master,slide:-700}); noise(t,0.08,0.2); },
    pickup(){ if(!ac) return; const t=ac.currentTime; [523,659,784,1046].forEach((f,i)=>tone({f,t:t+i*0.07,d:0.18,type:'triangle',v:0.25,dest:master})); },
    chest(){ if(!ac) return; const t=ac.currentTime; [392,523,659,784,1046,1318].forEach((f,i)=>tone({f,t:t+i*0.08,d:0.3,type:'triangle',v:0.25,dest:master})); },
    hurt(){ if(!ac) return; const t=ac.currentTime; tone({f:200,t,d:0.3,type:'sawtooth',v:0.3,dest:master,slide:-120}); noise(t,0.2,0.3); },
    hit(){ if(!ac) return; const t=ac.currentTime; tone({f:300,t,d:0.1,type:'square',v:0.2,dest:master,slide:-150}); },
    kill(){ if(!ac) return; const t=ac.currentTime; noise(t,0.35,0.5); tone({f:150,t,d:0.4,type:'sawtooth',v:0.3,dest:master,slide:-100}); },
    roar(){ if(!ac) return; const t=ac.currentTime; for(let i=0;i<3;i++) tone({f:70+i*5,t:t+i*0.25,d:0.5,type:'sawtooth',v:0.4,dest:master,slide:-30}); noise(t,0.8,0.4); },
    death(){ if(!ac) return; const t=ac.currentTime; [400,350,300,220].forEach((f,i)=>tone({f,t:t+i*0.15,d:0.3,type:'square',v:0.25,dest:master})); },
    win(){ if(!ac) return; const t=ac.currentTime; [523,659,784,1046,784,1046,1318].forEach((f,i)=>tone({f,t:t+i*0.12,d:0.35,type:'triangle',v:0.3,dest:master})); },
    splash(){ if(!ac) return; noise(ac.currentTime,0.4,0.5); },
  };
  function toggleMute(){ muted=!muted; if(master) master.gain.value=muted?0:0.8; return muted; }
  return {init,play,sfx,toggleMute,isMuted:()=>muted};
})();

function onKey(code){
  Audio_.init();
  if(code==='KeyM'){ const m=Audio_.toggleMute(); say(m?'Music muted (M to unmute)':'Music on',90); return; }
  if(state==='title' && (code==='Enter'||code==='Space')) { totalDeaths=0; startLevel(0); state='play'; }
  else if(state==='levelDone' && (code==='Enter'||code==='Space') && levelDoneT>60) nextLevel();
  else if(state==='win' && (code==='Enter'||code==='Space')) state='title';
  else if(state==='play' && code==='Space') shoot();
}
function onClick(){ Audio_.init(); if(state==='play') shoot(); else onKey('Enter'); }
function nextLevel(){ if(levelIdx+1>=LEVELS.length){ state='win'; } else { startLevel(levelIdx+1); state='play'; } }

function shoot(){
  if(shotCd>0 || sonny.onBeach) return;
  shotCd = 18;
  Audio_.sfx.shoot();
  const up = keys.KeyW||keys.ArrowUp, dn = keys.KeyS||keys.ArrowDown;
  const tilt = (dn?0.35:0) - (up?0.35:0);
  const a = sonny.face>0 ? tilt : Math.PI - tilt;
  spears.push({x:sonny.x+Math.cos(a)*30,y:sonny.y+Math.sin(a)*30,vx:Math.cos(a)*14+sonny.vx*0.3,vy:Math.sin(a)*14+sonny.vy*0.3,a,life:70});
}

function hurt(dmg){
  if(sonny.inv>0) return;
  sonny.hp -= dmg; sonny.inv = 40; hurtFlash = 12; Audio_.sfx.hurt();
  for(let k=0;k<10;k++) particles.push({x:sonny.x,y:sonny.y,vx:rand(-3,3),vy:rand(-3,3),life:30,c:'#ff3b3b'});
  if(sonny.hp<=0){
    deaths++; totalDeaths++;
    sonny.hp = sonny.maxHp; sonny.x=220; sonny.y=SURFACE-30; sonny.vx=sonny.vy=0; sonny.onBeach=true; sonny.inv=90;
    say('Ouch! Sonny swims back to shore... (unlimited lives!)', 150); Audio_.sfx.death();
    // push enemies away from the shore
    for(const e of enemies) if(e.x<900) e.x = rand(1000,WORLD_W-200);
    if(boss) { boss.x = clamp(sonny.x+900,400,WORLD_W-300); }
  }
}

// ---------- Update ----------
function update(){
  tick++;
  if(state!=='play') { if(state==='levelDone') levelDoneT++; return; }
  if(shotCd>0) shotCd--; if(hurtFlash>0) hurtFlash--; if(sonny.inv>0) sonny.inv--;
  for(const m of msgs) m.d--; msgs = msgs.filter(m=>m.d>0);

  // Sonny movement
  const up = keys.KeyW||keys.ArrowUp, dn = keys.KeyS||keys.ArrowDown, lf = keys.KeyA||keys.ArrowLeft, rt = keys.KeyD||keys.ArrowRight;
  const under = sonny.y > SURFACE;
  const acc = under ? 0.45 : 0.6;
  if(lf) { sonny.vx-=acc; sonny.face=-1; }
  if(rt) { sonny.vx+=acc; sonny.face=1; }
  if(under){
    if(up) sonny.vy-=acc; if(dn) sonny.vy+=acc;
    sonny.vx*=0.92; sonny.vy*=0.92;
    sonny.onBeach=false;
    if(tick%8===0) bubbles.push({x:sonny.x+sonny.face*14,y:sonny.y-10,r:rand(2,5),vy:-rand(0.6,1.4),life:120});
  } else {
    // on beach / surface: walk, press down to dive
    const beachEnd = 420;
    sonny.vx*=0.85; sonny.vy=0;
    if(sonny.x < beachEnd){ sonny.y = SURFACE-30 - Math.max(0,(beachEnd-sonny.x))*0.12; sonny.onBeach=true; }
    else { sonny.y = SURFACE-8; sonny.onBeach=false; if(dn){ sonny.y=SURFACE+5; sonny.vy=3; Audio_.sfx.splash(); } }
  }
  sonny.vx=clamp(sonny.vx,-6,6); sonny.vy=clamp(sonny.vy,-6,6);
  sonny.x=clamp(sonny.x+sonny.vx,30,WORLD_W-30);
  sonny.y=clamp(sonny.y+sonny.vy,SURFACE-80,WORLD_H-30);
  if(sonny.y>SURFACE && sonny.y<SURFACE+12 && up) sonny.y=SURFACE-8; // surface

  // Camera
  cam.x = clamp(sonny.x-W/2,0,WORLD_W-W); cam.y = clamp(sonny.y-H/2,0,WORLD_H-H);

  // Fish
  for(const f of fish){
    if(f.got) continue;
    f.ph+=0.1;
    const d=dist(f,sonny);
    if(d<220){ // flee slowly
      const a=Math.atan2(f.y-sonny.y,f.x-sonny.x); f.vx+=Math.cos(a)*0.08; f.vy+=Math.sin(a)*0.08;
    }
    f.vx+=Math.sin(f.ph*0.3)*0.03; f.vy+=Math.cos(f.ph*0.5)*0.03;
    f.vx=clamp(f.vx,-1.8,1.8); f.vy=clamp(f.vy,-1.2,1.2);
    f.x+=f.vx; f.y+=f.vy;
    if(f.x<500||f.x>WORLD_W-40) f.vx*=-1; if(f.y<SURFACE+60||f.y>WORLD_H-40) f.vy*=-1;
    f.x=clamp(f.x,500,WORLD_W-40); f.y=clamp(f.y,SURFACE+60,WORLD_H-40);
    if(d<sonny.r+f.r){ f.got=true; fishFound++; say(`Found a ${f.name}! (${fishFound}/5)`,120); burst(f.x,f.y,f.c); Audio_.sfx.pickup(); checkBoss(); }
  }
  // Chests
  for(const c of chests){
    if(!c.open && dist(c,sonny)<sonny.r+c.r+6){ c.open=true; chestsFound++; say(`Treasure chest opened! (${chestsFound}/5)`,120); burst(c.x,c.y,'#ffd700'); Audio_.sfx.chest(); checkBoss(); }
  }

  // Enemies
  for(const e of enemies){
    if(e.cool>0) e.cool--;
    const d=dist(e,sonny), a=Math.atan2(sonny.y-e.y,sonny.x-e.x);
    if(e.kind==='shark'){
      if(e.boss){
        if(e.dash>0){ e.dash--; }
        else if(d<520 && e.cool===0 && Math.random()<0.02){ e.dash=40; e.vx=Math.cos(a)*e.speed*3.2; e.vy=Math.sin(a)*e.speed*3.2; e.cool=90; }
        else { e.vx+= (Math.cos(a)*e.speed-e.vx)*0.04; e.vy+=(Math.sin(a)*e.speed-e.vy)*0.04; }
      } else if(d<450 && !sonny.onBeach && sonny.y>SURFACE){
        e.vx+=(Math.cos(a)*e.speed-e.vx)*0.05; e.vy+=(Math.sin(a)*e.speed-e.vy)*0.05;
      } else {
        if(Math.random()<0.01) e.vx=rand(-2,2);
        e.vy+=Math.sin(tick*0.03+e.x)*0.02; e.vy*=0.97;
      }
      if(e.dash>0){ e.vx*=0.985; e.vy*=0.985; }
      e.x+=e.vx; e.y+=e.vy;
      if(e.x<500||e.x>WORLD_W-60) e.vx*=-1; if(e.y<SURFACE+80||e.y>WORLD_H-60) e.vy*=-1;
      e.x=clamp(e.x,500,WORLD_W-60); e.y=clamp(e.y,SURFACE+80,WORLD_H-60);
      if(Math.abs(e.vx)>0.2) e.face=e.vx>0?1:-1;
    } else { // eel: lurk at home, lunge when close
      if(e.lunge>0){ e.lunge--; e.x+=e.vx; e.y+=e.vy; e.vx*=0.95; e.vy*=0.95; }
      else {
        if(d<260 && e.cool===0 && sonny.y>SURFACE){ e.lunge=30; e.cool=80; e.vx=Math.cos(a)*e.speed; e.vy=Math.sin(a)*e.speed; }
        else { e.x+=(e.hx-e.x)*0.03; e.y+=(e.hy+Math.sin(tick*0.05+e.hx)*6-e.y)*0.05; }
      }
      e.face = sonny.x>e.x?1:-1;
    }
    // contact damage
    if(d<e.r+sonny.r-6 && sonny.y>SURFACE) hurt(e.boss?25:(e.kind==='shark'?15:10));
  }

  // Spears
  for(const s of spears){
    s.x+=s.vx; s.y+=s.vy; s.vx*=0.985; s.vy*=0.985; s.life--;
    for(const e of enemies){
      if(e.hp>0 && dist(s,e)<e.r){
        e.hp--; s.life=0; burst(s.x,s.y,'#ff5050',6); Audio_.sfx.hit();
        if(e.hp<=0){ burst(e.x,e.y,'#ff2020',20); Audio_.sfx.kill(); say(e.boss?'BOSS SHARK DEFEATED!':(e.kind==='shark'?'Shark down!':'Eel down!'),90); }
        break;
      }
    }
  }
  spears=spears.filter(s=>s.life>0 && s.y>SURFACE-20);
  const dead = enemies.filter(e=>e.hp<=0);
  enemies=enemies.filter(e=>e.hp>0);
  if(boss && boss.hp<=0){ boss=null; state='levelDone'; levelDoneT=0; Audio_.sfx.win(); }
  // respawn regular enemies elsewhere after a while (keeps pressure up)
  for(const e of dead) if(!e.boss) setTimeout(()=>{ if(state==='play') enemies.push(e.kind==='shark'?makeShark(rand(1200,WORLD_W-200),rand(SURFACE+200,WORLD_H-200)):makeEel(rand(900,WORLD_W-200),rand(SURFACE+400,WORLD_H-100))); }, 12000);

  if(bossWarn>0) bossWarn--;

  // particles / bubbles
  for(const p of particles){ p.x+=p.vx; p.y+=p.vy; p.vx*=0.95; p.vy*=0.95; p.life--; }
  particles=particles.filter(p=>p.life>0);
  for(const b of bubbles){ b.y+=b.vy; b.x+=Math.sin(tick*0.1+b.r)*0.3; b.life--; }
  bubbles=bubbles.filter(b=>b.life>0 && b.y>SURFACE);
}
function burst(x,y,c,n=14){ for(let k=0;k<n;k++) particles.push({x,y,vx:rand(-4,4),vy:rand(-4,4),life:rand(20,45),c}); }
function checkBoss(){
  if(!boss && fishFound>=5 && chestsFound>=5){
    boss=makeBoss(); enemies.push(boss); bossWarn=180; Audio_.sfx.roar();
    say('A GIANT SHARK appears! Hit it 20 times with the spear gun!',240);
  }
}

// ---------- Drawing ----------
function draw(){
  ctx.clearRect(0,0,W,H);
  if(state==='title'){ drawTitle(); return; }
  if(state==='win'){ drawWin(); return; }
  drawWorld();
  drawHUD();
  if(state==='levelDone') drawLevelDone();
}

function drawWorld(){
  const cx=cam.x, cy=cam.y;
  // sky
  const sy = SURFACE-cy;
  if(sy>0){
    const g=ctx.createLinearGradient(0,0,0,sy); g.addColorStop(0,L.sky); g.addColorStop(1,'#ffffff');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,sy);
    // sun
    ctx.fillStyle='rgba(255,240,150,0.9)'; ctx.beginPath(); ctx.arc(W-140-cx*0.1,60,40,0,7); ctx.fill();
    // clouds
    ctx.fillStyle='rgba(255,255,255,0.8)';
    for(let k=0;k<6;k++){ const x=((k*400+tick*0.2)%(W+400))-200-cx*0.2; const y=40+k*25; ctx.beginPath(); ctx.arc(x,y,26,0,7); ctx.arc(x+30,y-10,32,0,7); ctx.arc(x+65,y,24,0,7); ctx.fill(); }
  }
  // water
  const g2=ctx.createLinearGradient(0,Math.max(0,sy),0,H); g2.addColorStop(0,L.water); g2.addColorStop(1,L.deep);
  ctx.fillStyle=g2; ctx.fillRect(0,Math.max(0,sy),W,H);
  // deep gradient by absolute depth
  ctx.fillStyle=`rgba(0,0,20,${clamp((cy-200)/WORLD_H*0.9,0,0.55)})`; ctx.fillRect(0,0,W,H);
  // light rays
  ctx.save(); ctx.globalAlpha=0.08; ctx.fillStyle='#fff';
  for(let k=0;k<6;k++){ const x=(k*220 - cx*0.5 + tick*0.3)%(W+300)-150; ctx.beginPath(); ctx.moveTo(x,sy); ctx.lineTo(x+60,sy); ctx.lineTo(x+220,H); ctx.lineTo(x+80,H); ctx.fill(); }
  ctx.restore();
  // waves
  ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=3; ctx.beginPath();
  for(let x=0;x<=W;x+=8) ctx.lineTo(x, sy+Math.sin((x+cx)*0.03+tick*0.08)*4);
  ctx.stroke();
  // beach
  const bx = 420-cx;
  if(bx>-200){
    ctx.fillStyle=L.sand; ctx.beginPath(); ctx.moveTo(-100,sy-60); ctx.lineTo(-100,sy+40); ctx.lineTo(bx+80,sy+40); ctx.lineTo(bx,sy-2); ctx.lineTo(bx-200,sy-30); ctx.lineTo(-100,sy-60); ctx.fill();
    // palm tree
    const px=80-cx, py=sy-40;
    ctx.strokeStyle='#7a4b21'; ctx.lineWidth=10; ctx.beginPath(); ctx.moveTo(px,py); ctx.quadraticCurveTo(px+20,py-80,px+10,py-150); ctx.stroke();
    ctx.fillStyle='#2f9e44';
    for(let k=0;k<6;k++){ ctx.beginPath(); ctx.ellipse(px+10+Math.cos(k)*35,py-150+Math.sin(k)*15,45,12,k,0,7); ctx.fill(); }
    // umbrella
    ctx.fillStyle='#e63946'; ctx.beginPath(); ctx.arc(260-cx,sy-70,45,Math.PI,0); ctx.fill();
    ctx.strokeStyle='#eee'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(260-cx,sy-70); ctx.lineTo(260-cx,sy-10); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 16px Trebuchet MS'; ctx.textAlign='center';
    ctx.fillText(L.name, 200-cx, sy-110);
  }
  // sea floor
  ctx.fillStyle=L.sand; ctx.beginPath(); ctx.moveTo(0,H+10);
  for(let x=0;x<=W;x+=20) ctx.lineTo(x, WORLD_H-cy-20+Math.sin((x+cx)*0.01)*12);
  ctx.lineTo(W,H+10); ctx.fill();
  // decor
  for(const d of decor){
    const x=d.x-cx, y=d.y-cy; if(x<-100||x>W+100||y<-100||y>H+100) continue;
    if(d.kind==='rock'){ ctx.fillStyle='#4a5566'; ctx.beginPath(); ctx.ellipse(x,y,d.r,d.r*0.6,0,0,7); ctx.fill(); ctx.fillStyle='#5f6d80'; ctx.beginPath(); ctx.ellipse(x-d.r*0.2,y-d.r*0.2,d.r*0.5,d.r*0.3,0,0,7); ctx.fill(); }
    else { ctx.strokeStyle=d.c; ctx.lineWidth=6; ctx.lineCap='round'; for(let k=-2;k<=2;k++){ ctx.beginPath(); ctx.moveTo(x,y+10); ctx.quadraticCurveTo(x+k*12,y-d.r*0.5,x+k*18+Math.sin(tick*0.03+k)*4,y-d.r); ctx.stroke(); } }
  }
  // seaweed
  ctx.strokeStyle='#1f8f4a'; ctx.lineWidth=5;
  for(let k=0;k<60;k++){ const wx=600+k*(WORLD_W/60), x=wx-cx; if(x<-20||x>W+20) continue; const y=WORLD_H-cy-20; ctx.beginPath(); ctx.moveTo(x,y); ctx.quadraticCurveTo(x+Math.sin(tick*0.04+k)*15,y-40,x+Math.sin(tick*0.04+k+1)*20,y-80); ctx.stroke(); }
  // chests
  for(const c of chests) drawChest(c.x-cx,c.y-cy,c.open);
  // fish
  for(const f of fish) if(!f.got) drawFish(f.x-cx,f.y-cy,f.c,f.vx<0?-1:1,f.r,f.ph);
  // enemies
  for(const e of enemies){ if(e.kind==='shark') drawShark(e.x-cx,e.y-cy,e.face,e.r,e.boss); else drawEel(e.x-cx,e.y-cy,e.face,e.r); }
  // spears
  ctx.strokeStyle='#ddd'; ctx.lineWidth=3;
  for(const s of spears){ const x=s.x-cx,y=s.y-cy; ctx.beginPath(); ctx.moveTo(x-Math.cos(s.a)*14,y-Math.sin(s.a)*14); ctx.lineTo(x+Math.cos(s.a)*14,y+Math.sin(s.a)*14); ctx.stroke(); ctx.fillStyle='#ffcf5a'; ctx.beginPath(); ctx.arc(x+Math.cos(s.a)*14,y+Math.sin(s.a)*14,3,0,7); ctx.fill(); }
  // Sonny
  drawSonny(sonny.x-cx,sonny.y-cy);
  // bubbles & particles
  ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=1.5;
  for(const b of bubbles){ ctx.beginPath(); ctx.arc(b.x-cx,b.y-cy,b.r,0,7); ctx.stroke(); }
  for(const p of particles){ ctx.globalAlpha=clamp(p.life/30,0,1); ctx.fillStyle=p.c; ctx.fillRect(p.x-cx-2,p.y-cy-2,4,4); }
  ctx.globalAlpha=1;
  if(hurtFlash>0){ ctx.fillStyle=`rgba(255,0,0,${hurtFlash/40})`; ctx.fillRect(0,0,W,H); }
  if(bossWarn>0 && Math.floor(bossWarn/15)%2===0){ ctx.fillStyle='rgba(255,40,40,0.9)'; ctx.font='bold 40px Trebuchet MS'; ctx.textAlign='center'; ctx.fillText('WARNING: SHARK BOSS!',W/2,H/2-120); }
}

function drawSonny(x,y){
  const f=sonny.face;
  if(sonny.inv>0 && Math.floor(tick/4)%2===0) ctx.globalAlpha=0.5;
  ctx.save(); ctx.translate(x,y); ctx.scale(f,1);
  const swim = sonny.y>SURFACE;
  const kick = Math.sin(tick*0.25)*(swim?8:2);
  // legs / flippers
  ctx.strokeStyle='#2b6cb0'; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-8,10); ctx.lineTo(-30,14+kick); ctx.moveTo(-8,14); ctx.lineTo(-30,22-kick); ctx.stroke();
  ctx.fillStyle='#111'; ctx.beginPath(); ctx.ellipse(-36,15+kick,10,4,0.2,0,7); ctx.fill(); ctx.beginPath(); ctx.ellipse(-36,23-kick,10,4,-0.2,0,7); ctx.fill();
  // body (swim trunks + skin)
  ctx.fillStyle='#f1b27a'; ctx.beginPath(); ctx.ellipse(0,4,18,12,0,0,7); ctx.fill();
  ctx.fillStyle='#e63946'; ctx.beginPath(); ctx.ellipse(-8,10,12,8,0,0,7); ctx.fill();
  // arm with spear gun
  ctx.strokeStyle='#f1b27a'; ctx.lineWidth=7; ctx.beginPath(); ctx.moveTo(4,4); ctx.lineTo(24,4); ctx.stroke();
  ctx.fillStyle='#333'; ctx.fillRect(18,-1,28,6); ctx.fillStyle='#ffcf5a'; ctx.fillRect(44,1,10,2);
  // head
  ctx.fillStyle='#f1b27a'; ctx.beginPath(); ctx.arc(14,-14,13,0,7); ctx.fill();
  // hair
  ctx.fillStyle='#4a2c12'; ctx.beginPath(); ctx.arc(12,-20,12,Math.PI,0); ctx.fill();
  // goggles
  ctx.fillStyle='#39c0ff'; ctx.strokeStyle='#222'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(20,-14,8,6,0,0,7); ctx.fill(); ctx.stroke();
  ctx.strokeStyle='#222'; ctx.beginPath(); ctx.moveTo(12,-14); ctx.lineTo(2,-14); ctx.stroke();
  // snorkel
  ctx.strokeStyle='#ff9f1c'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(24,-8); ctx.lineTo(28,-8); ctx.lineTo(30,-30); ctx.stroke();
  ctx.restore(); ctx.globalAlpha=1;
}
function drawFish(x,y,c,face,r,ph){
  ctx.save(); ctx.translate(x,y); ctx.scale(face,1);
  ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(0,0,r,r*0.6,0,0,7); ctx.fill();
  const t=Math.sin(ph*3)*4;
  ctx.beginPath(); ctx.moveTo(-r+2,0); ctx.lineTo(-r-10,-8+t); ctx.lineTo(-r-10,8+t); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.moveTo(-2,-r*0.5); ctx.lineTo(4,-r*0.5-8); ctx.lineTo(8,-r*0.4); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(r*0.5,-3,3.5,0,7); ctx.fill(); ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(r*0.55,-3,1.8,0,7); ctx.fill();
  ctx.restore();
  // sparkle to signal it's collectible
  ctx.fillStyle=`rgba(255,255,255,${0.5+0.5*Math.sin(tick*0.2)})`; ctx.beginPath(); ctx.arc(x,y-r-10,3,0,7); ctx.fill();
}
function drawChest(x,y,open){
  ctx.fillStyle='#8b5a2b'; ctx.fillRect(x-22,y-10,44,26);
  ctx.fillStyle='#a86e3a'; ctx.fillRect(x-22,open?-32+y:y-22,44,14);
  ctx.strokeStyle='#ffd700'; ctx.lineWidth=3; ctx.strokeRect(x-22,y-10,44,26);
  ctx.fillStyle='#ffd700'; ctx.fillRect(x-4,y-4,8,10);
  if(open){ ctx.fillStyle=`rgba(255,230,120,${0.5+0.4*Math.sin(tick*0.1)})`; ctx.beginPath(); ctx.arc(x,y-14,18,0,7); ctx.fill(); }
  else { ctx.fillStyle=`rgba(255,255,255,${0.5+0.5*Math.sin(tick*0.2+x)})`; ctx.beginPath(); ctx.arc(x,y-30,3,0,7); ctx.fill(); }
}
function drawShark(x,y,face,r,boss){
  ctx.save(); ctx.translate(x,y); ctx.scale(face,1);
  const s=r/34;
  ctx.fillStyle=boss?'#3b3f55':'#6c7a89';
  ctx.beginPath(); ctx.ellipse(0,0,34*s,14*s,0,0,7); ctx.fill();
  const t=Math.sin(tick*0.2)*6*s;
  ctx.beginPath(); ctx.moveTo(-30*s,0); ctx.lineTo(-48*s,-16*s+t); ctx.lineTo(-44*s,0); ctx.lineTo(-48*s,14*s+t); ctx.fill(); // tail
  ctx.beginPath(); ctx.moveTo(-4*s,-12*s); ctx.lineTo(4*s,-30*s); ctx.lineTo(12*s,-12*s); ctx.fill(); // fin
  ctx.fillStyle='#dfe6ee'; ctx.beginPath(); ctx.ellipse(4*s,6*s,24*s,7*s,0,0,7); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(14*s,6*s); for(let k=0;k<5;k++){ ctx.lineTo((16+k*4)*s,11*s); ctx.lineTo((18+k*4)*s,6*s); } ctx.fill(); // teeth
  ctx.fillStyle=boss?'#ff2b2b':'#111'; ctx.beginPath(); ctx.arc(20*s,-5*s,3.5*s,0,7); ctx.fill();
  ctx.restore();
}
function drawEel(x,y,face,r){
  ctx.save(); ctx.translate(x,y);
  ctx.strokeStyle='#3c8f3c'; ctx.lineWidth=12; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,0);
  for(let k=1;k<=6;k++) ctx.lineTo(-face*k*9, Math.sin(tick*0.15+k)*8);
  ctx.stroke();
  ctx.fillStyle='#4ea84e'; ctx.beginPath(); ctx.ellipse(0,0,12,9,0,0,7); ctx.fill();
  ctx.fillStyle='#ff0'; ctx.beginPath(); ctx.arc(face*5,-3,3,0,7); ctx.fill();
  ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(face*6,-3,1.5,0,7); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(face*6,4); ctx.lineTo(face*12,7); ctx.stroke();
  ctx.restore();
}

function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(0,0,W,52);
  ctx.textAlign='left'; ctx.fillStyle='#fff'; ctx.font='bold 18px Trebuchet MS';
  ctx.fillText(`Level ${levelIdx+1}/10 — ${L.name}`,14,22);
  ctx.font='16px Trebuchet MS';
  ctx.fillText(`Fish ${fishFound}/5    Chests ${chestsFound}/5    Lives ∞ (wipeouts: ${deaths})`,14,44);
  // health
  ctx.fillStyle='#333'; ctx.fillRect(W-230,12,200,16);
  ctx.fillStyle=sonny.hp>40?'#3ddc84':'#ff4040'; ctx.fillRect(W-230,12,200*sonny.hp/sonny.maxHp,16);
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.strokeRect(W-230,12,200,16);
  ctx.fillStyle='#fff'; ctx.textAlign='right'; ctx.fillText('Health',W-236,26);
  ctx.textAlign='left'; ctx.font='13px Trebuchet MS'; ctx.fillText(sonny.onBeach?'Walk right & press S/↓ at the water to dive':'WASD/Arrows swim · Space/Click fires the way Sonny faces · M mute',W-330,46);
  if(boss){
    ctx.fillStyle='#333'; ctx.fillRect(W/2-200,62,400,18);
    ctx.fillStyle='#ff2b2b'; ctx.fillRect(W/2-200,62,400*boss.hp/boss.maxHp,18);
    ctx.strokeStyle='#fff'; ctx.strokeRect(W/2-200,62,400,18);
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.font='bold 14px Trebuchet MS'; ctx.fillText(`SHARK BOSS  ${boss.hp}/20`,W/2,76);
  }
  // messages
  ctx.textAlign='center'; ctx.font='bold 22px Trebuchet MS';
  msgs.slice(-3).forEach((m,i)=>{ ctx.globalAlpha=clamp(m.d/30,0,1); ctx.fillStyle='#000'; ctx.fillText(m.t,W/2+2,H-40-i*30+2); ctx.fillStyle='#ffe66d'; ctx.fillText(m.t,W/2,H-40-i*30); });
  ctx.globalAlpha=1;
  // off-screen indicators for remaining collectibles
  const targets=[...fish.filter(f=>!f.got),...chests.filter(c=>!c.open)];
  if(boss) targets.push(boss);
  for(const t of targets){
    const sx=t.x-cam.x, sy=t.y-cam.y; if(sx>0&&sx<W&&sy>0&&sy<H) continue;
    const a=Math.atan2(sy-H/2,sx-W/2); const ex=W/2+Math.cos(a)*(W/2-30), ey=clamp(H/2+Math.sin(a)*(H/2-30),70,H-30);
    ctx.fillStyle=t===boss?'#ff2b2b':(t.name?'#7ad7ff':'#ffd700'); ctx.beginPath(); ctx.moveTo(ex+Math.cos(a)*10,ey+Math.sin(a)*10); ctx.lineTo(ex+Math.cos(a+2.5)*8,ey+Math.sin(a+2.5)*8); ctx.lineTo(ex+Math.cos(a-2.5)*8,ey+Math.sin(a-2.5)*8); ctx.fill();
  }
}

function drawLevelDone(){
  ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.fillStyle='#ffe66d'; ctx.font='bold 44px Trebuchet MS';
  ctx.fillText(`${L.name} cleared!`,W/2,H/2-60);
  ctx.fillStyle='#fff'; ctx.font='22px Trebuchet MS';
  ctx.fillText(`Sonny found all 5 fish, 5 treasures and beat the shark boss.`,W/2,H/2-10);
  ctx.fillText(`Wipeouts this level: ${deaths}`,W/2,H/2+30);
  if(levelDoneT>60){ ctx.fillStyle='#7ad7ff'; ctx.fillText(levelIdx+1<LEVELS.length?`Press Enter to travel to ${LEVELS[levelIdx+1].name}`:'Press Enter to finish the adventure',W/2,H/2+90); }
}
function drawTitle(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#8fd3ff'); g.addColorStop(0.35,'#1c8bd8'); g.addColorStop(1,'#04213f');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.fillStyle='#ffe66d'; ctx.font='bold 60px Trebuchet MS'; ctx.fillText("SONNY'S DEEP DIVE",W/2,140);
  ctx.fillStyle='#fff'; ctx.font='20px Trebuchet MS';
  const lines=['Sonny explores 10 beaches around the world.','Dive with your goggles and find 5 new fish and 5 treasure chests per level.','Watch out for sharks and eels! Shoot them with your spear gun.','Collect everything to summon the Shark Boss — 20 spear hits to win.','Unlimited lives: if your health runs out, you wash back to shore.','','Move: WASD / Arrows    Fire: Space / Click (shoots where Sonny faces)    Dive: S at the water'];
  lines.forEach((l,i)=>ctx.fillText(l,W/2,220+i*30));
  ctx.fillStyle=`rgba(255,255,255,${0.6+0.4*Math.sin(tick*0.1)})`; ctx.font='bold 26px Trebuchet MS'; ctx.fillText('Press Enter or Click to start',W/2,500);
  // a little Sonny on the title
  sonny = sonny||{x:0,y:SURFACE+50,face:1,inv:0}; const save=sonny; sonny={x:0,y:SURFACE+50,face:1,inv:0}; drawSonny(W/2,560); sonny=save;
}
function drawWin(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#ffd39a'); g.addColorStop(1,'#04213f');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.fillStyle='#ffe66d'; ctx.font='bold 56px Trebuchet MS'; ctx.fillText('WORLD TOUR COMPLETE!',W/2,200);
  ctx.fillStyle='#fff'; ctx.font='24px Trebuchet MS';
  ctx.fillText('Sonny explored all 10 beaches, found 50 fish, 50 treasures',W/2,270);
  ctx.fillText('and defeated 10 shark bosses!',W/2,305);
  ctx.fillText(`Total wipeouts: ${totalDeaths}`,W/2,360);
  ctx.fillStyle='#7ad7ff'; ctx.fillText('Press Enter to play again',W/2,440);
}

// ---------- Loop ----------
function pickMusic(){
  if(state==='title') Audio_.play('title');
  else if(state==='win') Audio_.play('win');
  else if(state==='levelDone') Audio_.play('win');
  else if(boss) Audio_.play('boss');
  else if(sonny.y>SURFACE) Audio_.play('dive');
  else Audio_.play('beach');
}
function loop(){ update(); pickMusic(); draw(); requestAnimationFrame(loop); }
loop();
</script>
